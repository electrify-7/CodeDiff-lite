[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "covdiff-lite"
version = "0.1.0"
description = "Oracle-guided calibration of GCC and LLVM C coverage pipelines"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.5,<4"]

[project.scripts]
covdiff-lite = "covdiff_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
covdiff_lite = ["report_assets/*.html", "report_assets/*.css", "report_assets/*.js"]
